name: Job Watcher

on:
  # Self-chaining: immediately re-queue the next run when the current one
  # completes. This is the primary cadence driver — it removes dependence on
  # GitHub's cron scheduler, which routinely delays or drops events by 1-4 h
  # (confirmed by analysing 50 runs: median gap was 104 min on a */30 schedule;
  # 55% of gaps exceeded 90 min). With workflow_run, the next run queues in
  # seconds rather than waiting for the next cron tick.
  workflow_run:
    workflows: ["Job Watcher"]
    types: [completed]

  # Backup schedule: fires every 7 minutes at :07/:14/… (off the :00/:30
  # peaks GitHub flags as high-load). If workflow_run is delayed or a manual
  # run was the last run, this ensures a new run queues within ≤7 minutes.
  schedule:
    - cron: '7/7 * * * *'

  workflow_dispatch:           # manual trigger from the GitHub UI

concurrency:
  group: job-watcher
  # Do not cancel in-progress runs — a pending run will queue and start
  # as soon as the current one finishes, keeping state writes serialised.
  cancel-in-progress: false

permissions:
  contents: write              # needed so the job can commit seen state back

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Sync to latest master
        # actions/checkout pins the SHA at run-creation time, not job-start time.
        # Queued runs must fast-forward past state commits made while they waited,
        # otherwise already-alerted jobs can be sent again.
        run: git pull --ff-only origin master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # firefox: every Playwright-based fetcher except natwest. chromium:
        # natwest specifically -- its Cloudflare challenge blocks Firefox
        # indefinitely but passes cleanly under Chromium (see natwest_fetcher.py).
        run: playwright install firefox chromium

      - name: Verify Playwright browsers (repair corrupted or stale-version cache)
        run: |
          # A file existing under the cache path is not enough -- a stale
          # cache (browser build left over from a previously-installed
          # playwright version) can satisfy a naive existence check while
          # still being the wrong build for the *currently installed*
          # playwright package, which fails at launch with "Executable
          # doesn't exist at <expected-build-path>". Actually launch both
          # browsers to catch that case. Confirmed root cause of a real
          # production incident (2026-09-01): this exact failure, retried
          # 3x per company by several fetchers, went on to leak a partially
          # -started Playwright instance into the retry, which then failed
          # a *second*, unrelated-looking way ("Sync API inside the asyncio
          # loop") that masked the true cause for hours of investigation.
          if ! python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for name in ('firefox', 'chromium'):
                  b = getattr(p, name).launch(headless=True)
                  b.close()
          " 2>/dev/null; then
            echo "Browser missing or wrong build for the installed playwright version — reinstalling"
            playwright install firefox chromium
          fi

      - name: Install Playwright system deps
        run: playwright install-deps firefox chromium

      - name: Run all watchers with bounded concurrency
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python -u src/run_all.py --workers 20

      - name: Save updated watcher state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.jsonunion.driver "python3 scripts/merge_seen_jobs_union.py %O %A %B"
          # -u deliberately stages only already-tracked state files. The quoted
          # pathspec covers Microsoft's seen_jobs.json and every company suffix.
          git add -u -- 'seen_jobs*.json' pipeline_failures.json
          if git diff --staged --quiet; then
            echo "No watcher state changes this run"
          else
            git commit -m "chore: update watcher state [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin master && git push; then
                pushed=1
                break
              fi
              echo "push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push watcher state after 3 attempts -- dedup state was NOT saved; expect duplicate alerts next run."
              exit 1
            fi
          fi
