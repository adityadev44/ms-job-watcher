name: Job Watcher

on:
  # Local-primary cutover mode: no automatic GitHub schedule.
  # Keep manual dispatch available as an emergency fallback.
  workflow_dispatch:

concurrency:
  group: job-watcher
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Sync to latest master
        run: git pull --ff-only origin master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install firefox chromium

      - name: Verify Playwright browsers
        run: |
          if ! python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for name in ('firefox', 'chromium'):
                  b = getattr(p, name).launch(headless=True)
                  b.close()
          " 2>/dev/null; then
            echo "Browser missing or wrong build for the installed playwright version — reinstalling"
            playwright install firefox chromium
          fi

      - name: Install Playwright system deps
        run: playwright install-deps firefox chromium

      - name: Run all watchers with bounded concurrency
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python -u src/run_all.py --workers 20

      - name: Save updated watcher state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.jsonunion.driver "python3 scripts/merge_seen_jobs_union.py %O %A %B"
          git add -u -- 'seen_jobs*.json' pipeline_failures.json
          if git diff --staged --quiet; then
            echo "No watcher state changes this run"
          else
            git commit -m "chore: update watcher state [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin master && git push; then
                pushed=1
                break
              fi
              echo "push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push watcher state after 3 attempts -- dedup state was NOT saved; expect duplicate alerts next run."
              exit 1
            fi
          fi
