  keywords: &default_keywords
    - "software engineer"
    - "senior software engineer"
    - ".NET developer"
    - "C# developer"
    - "dot net"
    - "angular"
    - "AI engineer"
    - "machine learning engineer"
    - "python developer"
    - "generative ai engineer"
  india_locations: &india_locations
    - "India"
  exclude_locations: &default_exclude_locations
    - "Chennai"
    - "Tamil Nadu"
    - "Pune"
    - "Chandigarh"
    - "Kochi"
    - "Kerala"
    - "Trivandrum"
    - "Lucknow"
    - "Nagpur"
    - "Madurai"
    - "Kolkata"
    - "Indore"

