matching:
  # Include a job if its title belongs to the software-engineer family.
  # Matching is normalised: case, hyphens, C#/CSharp/.NET/dotnet, and
  # Roman numerals (II/III) are treated as equal to Arabic (2/3).
  # No specific seniority is required — any level in the family passes.
  title_family:
    - "software engineer"
    - "software engr"
    - "software senior engineer"
    - "software developer"
    - "software development engineer"
    - "SDE"
    - "SWE"
    - "full stack engineer"
    - "backend engineer"
    - "full-stack developer"
    - "backend developer"
    - ".NET developer"
    - "application developer"
    - "application engineer"
    - "staff engineer"
    - "senior staff engineer"
    - "associate staff engineer"
    - "senior engineer"
    - "machine learning engineer"
    - "ml engineer"
    - "ai engineer"
    - "artificial intelligence engineer"
    - "generative ai engineer"
    - "genai engineer"
    - "llm engineer"
    - "applied ai engineer"
    - "ai platform engineer"
    - "python developer"
    - "python engineer"
    - "C# developer"
    - ".NET engineer"
    - "C# engineer"
    - "fullstack developer"
    - "fullstack engineer"
    - "lead engineer"
    - "lead developer"
    - "lead software engineer"
    - "platform engineer"
    - "data engineer"
    - "cloud engineer"
    - "devops engineer"
    - "site reliability engineer"
    - "performance engineer"
    - "member of technical staff"
    - "member technical staff"
    - "conversational developer"

  # Keep a job only if its description mentions at least one of these skills.
  # A job must match BOTH this list AND primary_skills (below) — they are
  # independent checks — so every primary_skills term (every group) MUST also
  # be listed here, plus the soft/broad-only signals that never qualify alone.
  skills:
    - ".NET"
    - ".NET Core"
    - ".NET Framework"
    - "dotnet"
    - "C#"
    - "ASP.NET"
    - "Web API"
    - "SQL Server"
    - "T-SQL"
    - "Azure"
    - "Angular"
    - "TypeScript"
    - "React"
    - "Entity Framework"
    - "Python"
    - "machine learning"
    - "artificial intelligence"
    - "Golang"
    - "multi-agent"
    - "agentic"
    - "prompt engineering"
    - "OpenAI"
    - "Anthropic"
    - "LangChain"
    - "LangGraph"
    - "RAGAS"
    - "Langfuse"
    - "LangSmith"
    - "CrewAI"
    - "vector database"
    - "ChromaDB"
    - "Pinecone"
    - "generative ai"
    - "large language model"
    - "retrieval augmented generation"

  # At least one "hard" skill from ONE of these named groups must appear in the
  # description — a job qualifies via EITHER track, not both. Broad-only terms
  # from `skills` above (Azure/Angular/TypeScript/React/Python/machine learning/
  # etc.) are NOT sufficient alone; they appear in too many unrelated postings.
  # Leave a group empty (or the whole mapping empty) to disable that check.
  #
  # This mapping is also the source of the "[tag]" prefix matcher.py attaches
  # to each alert (see src/matcher.py find_matching_jobs) so Shivangi can tell
  # .NET/C# hits apart from AI/ML/Python hits in one combined Telegram/Gmail
  # feed. Group names are shown verbatim in the alert — keep them short.
  #
  # Deliberately excludes bare "AI", "ML", "RAG", "LLM", "GPT", "Go" everywhere
  # in this file: matcher.py's substring check is NOT word-boundary aware, and
  # those short tokens are substrings of extremely common words in ordinary
  # job descriptions — "RAG" alone matches inside "storage"/"average"/"garage",
  # "Go" matches inside "going"/"ongoing"/"algorithm", "ML" matches inside
  # "HTML". Use full distinctive terms (LangChain, generative ai, large
  # language model, Golang, ...) instead — same signal, no false positives.
  #
  # "SQL Server"/"T-SQL"/"Web API" are deliberately NOT in the .NET/C# group
  # below (kept only in the broader `skills` list) — they're a database and a
  # generic REST-API phrase any language's app can use, not .NET-specific.
  # Confirmed 2026-08-31: a Citi "Senior Python Application Developer" JD got
  # wrongly tagged [.NET / C#] purely because it mentioned "SQL Server" as its
  # database — the actual FI Risk role was fine ("Java (or .NET Core)"
  # explicitly accepts either), but the Python role's mistagging was a real
  # false positive Shivangi flagged directly. This was already a known
  # weakness before the AI/ML track existed (see the per-company
  # require_tech_in_description comments below — several explicitly call out
  # "SQL Server/EF" as a shared-primary-skill false-positive risk) but only
  # started producing visibly wrong TAGS once a second track existed for a
  # job to be wrongly attributed to.
  primary_skills:
    ".NET / C#":
      - ".NET"
      - ".NET Core"
      - ".NET Framework"
      - "dotnet"
      - "C#"
      - "ASP.NET"
      - "Entity Framework"
    "AI / ML / Python":
      - "LangChain"
      - "LangGraph"
      - "RAGAS"
      - "Langfuse"
      - "LangSmith"
      - "CrewAI"
      - "vector database"
      - "ChromaDB"
      - "Pinecone"
      - "generative ai"
      - "large language model"
      - "retrieval augmented generation"

  # Reject a job immediately if its title contains any of these terms, as a
  # whole word/phrase (matched via word boundaries, not plain substring — so
  # "VP" rejects "VP - Engineering" but not "AVP"/"SVP", and "director"
  # rejects "Director of Engineering" but not "Active Directory").
  #
  # 2026-09-05 precision-pass audit (near_miss_audit.py over the last 20 live
  # runs, ~45.6k deduped real rejections): "principal", "director",
  # "vice president", "VP", and "data scientist" were REMOVED from this list.
  # Real evidence across dozens of tagged rejections (BlackRock, Citi, Goldman
  # Sachs, Deutsche Bank, PepsiCo, Luxoft, The Hartford — see PLAYBOOK.md)
  # showed these four consistently killing genuine hands-on .NET/C#/AI IC
  # roles that use "Principal"/"Director"/"VP"/"Assistant Vice President" as a
  # seniority band rather than a people-management signal (e.g. BlackRock's
  # "Application Engineer, Vice President", Citi's "Senior AI/ML Engineer -
  # Vice President", Atlassian's "Principal Backend Software Engineer"), and
  # hybrid "Software Engineer/Data Scientist" titles at The Hartford. This is
  # safe because two independent gates still apply after this one: a title
  # must also match `title_family` (a bare "VP, Business Finance" or
  # "Director of Legal" never will), and the description must still name a
  # real primary_skills term — a genuine non-technical VP/Director posting's
  # JD won't mention concrete .NET/LangChain/RAG content even if its title
  # slips past this gate.
  #
  # "manager"/"engineering manager" were deliberately KEPT despite two known
  # real counter-examples (PepsiCo's "Senior Development Manager - AI
  # Engineering", Nutanix's "Engineering Manager – Agentic AI & SaaS" — both
  # confirmed genuine IC AI roles via their JD content in earlier waves):
  # sampling the same live audit data found far more titles where "Manager"
  # is a real people-management signal that would otherwise slip past
  # `title_family`'s loose substring matching purely because "Engineering"
  # contains "engineer" as a prefix (e.g. Atlassian's "Senior Engineering
  # Manager, Search Infrastructure", eBay's/CRISIL's/FactSet's "Data/Software
  # Engineering Manager" roles — all real managers, not IC). Removing
  # "manager" would have recovered 2 known roles at the cost of reopening
  # this much larger, already-fixed false-positive class. PepsiCo's and
  # Nutanix's 2 specific titles remain a known, deliberate residual gap —
  # not silently dropped, just not safely fixable with a global term change.
  exclude_terms:
    - "intern"
    - "internship"
    - "trainee"
    - "apprentice"
    - "fresher"
    - "graduate"
    - "new grad"
    - "university"
    - "head of"
    - "engineering manager"
    - "manager"
    - "mechanical"
    - "electrical"
    - "industrial"
    - "hardware"
    - "firmware"
    - "embedded"
    - "datacenter technician"
    - "network engineer"
    - "sales engineer"
    - "solutions engineer"
    - "customer engineer"
    - "support engineer"

